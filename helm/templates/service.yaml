apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "cpin-ines-s3.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cpin-ines-s3.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
