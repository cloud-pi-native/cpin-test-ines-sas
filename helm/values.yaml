image:
  repository: registry.example.com/cpin-ines-s3
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

# Name of the Kubernetes Secret generated by the SopsSecret (templates/sopssecret.yaml).
# Must match spec.secretTemplates[0].name in that file.
secretName: cpin-ines-s3

# Non-sensitive configuration, injected through a ConfigMap.
env:
  PORT: "3000"
  MAX_UPLOAD_MB: "5"
  SENDER_S3_ENDPOINT: https://s3.sender.example.com
  SENDER_S3_REGION: us-east-1
  SENDER_S3_BUCKET: emetteur
  SENDER_S3_PREFIX: ""
  SENDER_S3_FORCE_PATH_STYLE: "true"
  RECEIVER_S3_ENDPOINT: https://s3.receiver.example.com
  RECEIVER_S3_REGION: us-east-1
  RECEIVER_S3_BUCKET: recepteur
  RECEIVER_S3_PREFIX: ""
  RECEIVER_S3_FORCE_PATH_STYLE: "true"
  INES_BASE_URL: https://ines.exemple.com
  INES_ACCOUNT_NAME: CPIN_INES_DEMO_EMETTEUR
  INES_SITE: TS_CPIN_INES_DEMO_EMETTEUR_S3
  INES_DESTINATION_DIRECTORY: /
  INES_IDP_ID: ST_IDP
  # HTTPS_PROXY: http://proxy.example.com:3128
  # HTTP_PROXY: http://proxy.example.com:3128
  # NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local

tmpVolume:
  sizeLimit: 64Mi

service:
  port: 80

ingress:
  enabled: false
  className: ""
  host: cpin-ines-s3.example.com
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
